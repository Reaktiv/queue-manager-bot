server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Xavfsizlik to'ri: agar bu konteyner tashqi nginx orqali emas, to'g'ridan-to'g'ri
    # (masalan, docker-compose'dagi "3000:80" mappingi orqali) ochilsa ham, /api
    # so'rovlari jim-jit index.html (200, text/html) qaytarib, frontend'da chalkash
    # "serverga ulanib bo'lmadi" xatosini bermasin - backend'ga proxy qilamiz.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
